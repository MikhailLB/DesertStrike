org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation — it can fail when the project path
# contains spaces / non-ASCII characters (gray_part_pitfalls.md §6).
kotlin.incremental=false
# AGP 9.0 newDsl is enabled by default; keep the legacy built-in Kotlin flag
# off so the Flutter template's Kotlin plugin handles compilation.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
