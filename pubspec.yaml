name: desert_strike
description: "DesertStrike — Egyptian-themed sniper game."
publish_to: 'none'

# versionName . versionCode  (kept in sync with android/app/build.gradle.kts)
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── Gray flow stack ────────────────────────────────────────────────────────
  # Versions are deliberately staggered against sibling titles so two builds
  # never share an identical dependency set (lock-file fingerprint hardening).
  appsflyer_sdk: ^6.15.4
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  firebase_app_check: ^0.3.2+8
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.5
  http: ^1.3.0
  device_info_plus: ^11.5.0
  flutter_secure_storage: ^10.0.0
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  # file_picker MUST stay on the 8.x line — the 10.x rewrite is Kotlin-only
  # and brings a Kotlin Gradle Plugin that collides with Flutter's built-in
  # Kotlin support (see gray_part_pitfalls.md §1).
  file_picker: 8.1.4

  # ── White flow (existing game) ─────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # Adaptive icon: the foreground PNG already contains the artwork scaled to
  # 70% of the 1024×1024 canvas with transparent padding, so every Android
  # mask shape (circle, squircle, square, rounded square, …) keeps the full
  # image visible without any edge cropping. The background is the dominant
  # warm tone sampled from the artwork.
  adaptive_icon_background: "#341100"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/Notifications/
    - assets/Nowifi/
